{{define "title"}}Asignar Precio{{end}}

{{define "main"}}
<h2>Asignar Precio</h2>
<form action='/assign-price' method='POST'>
    <fieldset>
        <legend>Datos del Producto</legend>
        <label for='department_id'>ID del Departamento</label><br>
        <input type='text' id='department_id' name='department_id'><br>
        <label for='product_id'>ID del Producto</label><br>
        <input type='text' id='product_id' name='product_id'><br>
        <label for='price'>Precio</label><br>
        <input type='text' id='price' name='price'><br>
        <br>
        <input type='submit' value='Asignar Precio'>
    </fieldset>
</form>
{{end}}
